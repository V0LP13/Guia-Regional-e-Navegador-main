<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Praia Grande</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Praia Grande</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Foto da Cidade -->
  <ion-card class="cidade-foto-card">
    <img [src]="cidadeFoto" alt="{{ cidadeNome }}" class="cidade-img" onerror="this.src='assets/images/placeholder-cidade.svg'">
    <div class="cidade-overlay">
      <h2>{{ cidadeNome }}</h2>
    </div>
  </ion-card>

  <!-- Descrição da Cidade -->
  <ion-card class="descricao-card">
    <ion-card-header>
      <ion-card-title>Sobre a Cidade</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ descricao }}</p>
    </ion-card-content>
  </ion-card>

  <!-- Pontos Turísticos -->
  <ion-card class="pontos-turisticos-card">
    <ion-card-header>
      <ion-card-title>Pontos Turísticos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item *ngFor="let ponto of pontosTuristicos" class="ponto-item">
          <ion-thumbnail slot="start">
            <img [src]="ponto.imagem" alt="{{ ponto.nome }}" onerror="this.src='assets/images/placeholder-turismo.svg'">
          </ion-thumbnail>
          <ion-label>
            <h3>{{ ponto.nome }}</h3>
            <p>{{ ponto.descricao }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
