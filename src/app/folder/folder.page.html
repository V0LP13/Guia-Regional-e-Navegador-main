<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Início</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Guia Regional</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Card de Busca por CEP -->
  <ion-card class="busca-cep-card">
    <ion-card-header>
      <ion-card-title>Buscar Cidade por CEP</ion-card-title>
      <ion-card-subtitle>Digite o CEP para encontrar a cidade na Baixada Santista</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">CEP</ion-label>
        <ion-input 
          [(ngModel)]="cep" 
          placeholder="Ex: 11088-190 ou 11088190"
          type="text"
          inputmode="numeric"
          maxlength="9"
          (ionBlur)="formatarCep()"
        ></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="pesquisar()" class="ion-margin-top" fill="solid" color="primary">
        <ion-icon slot="start" name="search-outline"></ion-icon>
        Buscar Cidade
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Lista rápida de cidades -->
  <ion-card class="cidades-rapidas-card">
    <ion-card-header>
      <ion-card-title>Cidades da Região</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="6" size-md="4" *ngFor="let cidade of cidadesRapidas">
            <ion-button 
              fill="outline" 
              color="primary" 
              class="cidade-btn"
              (click)="navegarParaCidade(cidade.rota)"
            >
              <ion-icon [name]="cidade.icone" slot="top" class="ion-margin-bottom"></ion-icon>
              {{ cidade.nome }}
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
