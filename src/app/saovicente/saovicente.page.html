<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>São Vicente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">São Vicente</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card class="cidade-foto-card">
    <img [src]="cidadeFoto" alt="{{ cidadeNome }}" class="cidade-img" onerror="this.src='assets/images/placeholder-cidade.svg'">
    <div class="cidade-overlay">
      <h2>{{ cidadeNome }}</h2>
    </div>
  </ion-card>

    <ion-card class="descricao-card">
    <ion-card-header>
      <ion-card-title>Sobre a Cidade</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ descricao }}</p>
      <div class="lista">
        <ion-button target="_blank" href="https://www.saovicente.sp.gov.br">
          <ion-icon slot="start" name="open-outline"></ion-icon>Site da
          Prefeitura</ion-button>
        <p>Ou ligue pelo número da prefeitura:</p>
        <ion-button href="tel:+551335791300">
          <ion-icon name="call-outline" slot="start"></ion-icon>
          Ligar
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-card class="pontos-turisticos-card">
    <ion-card-header>
      <ion-card-title>Pontos Turísticos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item *ngFor="let ponto of pontosTuristicos" class="ponto-item">
          <ion-thumbnail slot="start">
            <img [src]="ponto.imagem" alt="{{ ponto.nome }}" onerror="this.src='assets/images/placeholder-turismo.svg'">
          </ion-thumbnail>
          <ion-label>
            <h3>{{ ponto.nome }}</h3>
            <p>{{ ponto.descricao }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
